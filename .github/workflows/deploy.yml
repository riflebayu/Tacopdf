name: Vercel Production CI/CD

on:
  push:
    branches:
      - main

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  Deploy-to-Vercel:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Bun (Superfast Package Manager)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 3. Install Dependencies
        run: bun install

      - name: 4. Execute Build & Puppeteer SSG Event-Driven
        # Di sinilah Vite bekerja dan Puppeteer menunggu event 'seo-ready'
        run: bun run build
        
      - name: 5. Install Vercel CLI
        run: bun install -g vercel

      - name: 6. Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 7. Build Vercel Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 8. Deploy to Vercel (Pasif / Prebuilt)
        # Melempar hasil build murni ke server Vercel tanpa membebankan rendering ulang
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}